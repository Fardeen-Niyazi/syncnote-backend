services:
  - type: web
    name: syncnote-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: DATABASE_URL
        sync: false
      - key: DEMO_USER_ID
        sync: false
